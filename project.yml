name: GymBuddy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    # DEVELOPMENT_TEAM comes from the gitignored Local.xcconfig, included by
    # Signing.xcconfig — see Local.xcconfig.example. Never set it here.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GymBuddyCore:
    path: Core
targets:
  GymBuddy:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
      - path: Resources
        excludes:
          - "**/*.md"
      - path: demo
        type: folder
        buildPhase: resources
    entitlements:
      path: GymBuddy.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(APP_BUNDLE_ID)
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.$(APP_BUNDLE_ID)
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Gym Buddies
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        AppStoreRegion: $(APP_STORE_REGION)
        UIFileSharingEnabled: false
        # iCloud Drive → Gym Buddies, where the daily iCloud backup lands.
        # Dict KEYS don't get $(...) expansion, so APP_BUNDLE_ID is substituted
        # by the Info.plist preprocessor (INFOPLIST_PREPROCESSOR_DEFINITIONS).
        NSUbiquitousContainers:
          iCloud.APP_BUNDLE_ID:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gym Buddies
            NSUbiquitousContainerSupportedFolderLevels: None
    settings:
      base:
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: APP_BUNDLE_ID=$(APP_BUNDLE_ID)
        # us | cn — `make <target> STORE=cn`
        APP_STORE_REGION: us
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GymBuddyCore
        product: GymBuddyCore
      - sdk: libsqlite3.tbd
schemes:
  GymBuddy:
    build:
      targets:
        GymBuddy: all
    run:
      config: Debug
    archive:
      config: Release
