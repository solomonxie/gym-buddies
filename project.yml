name: GymBuddy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    # DEVELOPMENT_TEAM comes from the gitignored Local.xcconfig, included by
    # Signing.xcconfig — see Local.xcconfig.example. Never set it here.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GymBuddyCore:
    path: Core
targets:
  GymBuddy:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
      - path: Resources
        excludes:
          - "**/*.md"
    entitlements:
      path: GymBuddy.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.example.gymbuddy
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.example.gymbuddy
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Gym Buddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
        # iCloud Drive → Gym Buddy, where the daily iCloud backup lands.
        NSUbiquitousContainers:
          iCloud.com.example.gymbuddy:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gym Buddy
            NSUbiquitousContainerSupportedFolderLevels: None
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gymbuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GymBuddyCore
        product: GymBuddyCore
      - sdk: libsqlite3.tbd
schemes:
  GymBuddy:
    build:
      targets:
        GymBuddy: all
    run:
      config: Debug
    archive:
      config: Release
