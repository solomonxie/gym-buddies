name: GymBuddy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    # Set your own Apple Developer Team ID to build for a physical device —
    # find it at developer.apple.com/account or Xcode > Settings > Accounts.
    # Left blank here deliberately: don't commit a real team ID (personal
    # account info) — override at build time instead, e.g.:
    #   xcodebuild ... DEVELOPMENT_TEAM=YOUR_TEAM_ID
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  GymBuddyCore:
    path: Core
targets:
  GymBuddy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Gym Buddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: Counts reps and rest without keeping the screen awake.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gymbuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GymBuddyCore
        product: GymBuddyCore
      # Needed once the store in Core starts calling SQLite directly (T2.3).
      - sdk: libsqlite3.tbd
schemes:
  GymBuddy:
    build:
      targets:
        GymBuddy: all
    run:
      config: Debug
    archive:
      config: Release
